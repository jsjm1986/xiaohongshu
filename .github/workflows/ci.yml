# 四包统一验证:build -> typecheck -> test。
#
# 顺序不可省:@content-agent/agent-core 与 agent-harness-core 的入口指向 dist/,
# web/api 的 typecheck 与测试都要先有这两个包的构建产物。npm test 串行跑
# agent-core(vitest) -> harness(vitest) -> web(node:test) -> api(node:test),
# 与本地 `npm test` 完全一致——CI 不引入本地复现不了的差异。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # 浏览器冒烟单列一个 job:装 Chromium 约 1 分钟,与 verify 并行不拖累主反馈;
  # 它抓的是「测试全绿但页面白屏」——bundle 加载失败、路由崩溃、登录闭环断裂。
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:browser
