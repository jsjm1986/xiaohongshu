services:
  content-agent:
    build: .
    ports:
      - "8780:8780"
    env_file:
      - .env
    environment:
      # Direct development binds loopback; a container must accept traffic from
      # its bridge interface for the published port to work.
      HOST: 0.0.0.0
      # env_file may contain host-oriented values such as ./data. Container
      # invariants must override them so all durable data reaches the volume.
      NODE_ENV: production
      CONTENT_AGENT_DATA_DIR: /data
      CONTENT_AGENT_DB_PATH: /data/app.db
    volumes:
      - ./data:/data
    restart: unless-stopped
